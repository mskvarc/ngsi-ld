[package]
name = "ngsi-ld"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bon = { version = "3.10.3", default-features = false, features = ["std"] }
bytes = { version = "1.12.1", default-features = false, features = ["std"], optional = true }
cefact-units = { version = "1.0.0", default-features = false, features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
derive_more = { version = "2.1.1", default-features = false, features = ["std", "debug", "display", "from", "from_str", "as_ref", "into", "is_variant", "deref"] }
geo-types = { version = "0.7.20", default-features = false, features = ["std"], optional = true }
geojson = { version = "1.0.0", default-features = false, optional = true }
headers = { version = "0.4.2", default-features = false, optional = true }
http = { version = "1.5.0", default-features = false, features = ["std"], optional = true }
indexmap = { version = "2.14.2", default-features = false, features = ["std"] }
iri-rs = { version = "3.4.1", default-features = false, features = ["static", "serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
jsonld = { version = "0.25.0", default-features = false, optional = true }
jstrict = { version = "0.16.0", default-features = false, features = ["serde", "simdutf8"] }
langtag = { version = "1.1.0", default-features = false, features = ["std", "serde"] }
mediatype = { version = "0.23.0", default-features = false }
nutype = { version = "0.8.0", default-features = false, features = ["std", "serde"] }
percent-encoding = { version = "2.3.2", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.13.5", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
stacker = { version = "0.1.25", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["std", "derive"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
url = { version = "2.5.8", default-features = false, features = ["serde", "std"] }
urn-rs = { version = "0.9.2", default-features = false, features = ["serde", "std"] }
winnow = { version = "1.0.4", default-features = false, features = ["std", "parser"] }

[features]
chrono = ["dep:chrono"]
geo-types = ["dep:geo-types"]
geojson = ["dep:geojson"]
http = ["dep:bytes", "dep:headers", "dep:http", "dep:percent-encoding"]
linked-data = ["dep:jsonld"]
reqwest = ["http", "dep:reqwest"]

[dev-dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_qualifications = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
absolute_paths = "deny"
allow_attributes_without_reason = "deny"
arc_with_non_send_sync = "deny"
await_holding_lock = "deny"
branches_sharing_code = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cloned_instead_of_copied = "warn"
expect_used = "deny"
future_not_send = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"
unnecessary_self_imports = "warn"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
