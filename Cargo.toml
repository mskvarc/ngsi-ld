[package]
name = "ngsi-ld"
version = "1.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Typed, ergonomic NGSI-LD (ETSI GS CIM 009 v1.9.1): the data model, the query languages and a client for context brokers"
documentation = "https://docs.rs/ngsi-ld"
readme = "README.md"
repository = "https://github.com/mskvarc/ngsi-ld"
license = "MIT OR Apache-2.0"
keywords = ["ngsi-ld", "fiware", "linked-data", "json-ld", "context-broker"]
categories = ["api-bindings", "data-structures", "encoding", "parser-implementations", "web-programming::http-client"]
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]
exclude = [".github"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bon = "3.10.3"
bytes = { version = "1.12.1", optional = true }
cefact-units = { version = "1.0.0", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
derive_more = { version = "2.1.1", features = ["debug", "display", "from", "from_str", "as_ref", "into", "is_variant", "deref"] }
geo-types = { version = "0.7.20", optional = true }
geojson = { version = "1.0.0", default-features = false, optional = true }
headers = { version = "0.4.2", optional = true }
http = { version = "1.5.0", optional = true }
indexmap = "2.14.2"
iri-rs = { version = "3.4.1", features = ["static", "serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
jsonld = { version = "0.26.0", default-features = false, optional = true }
jstrict = { version = "0.16.0", features = ["serde"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
nutype = { version = "0.8.0", features = ["serde"] }
percent-encoding = { version = "2.3.2", optional = true }
reqwest = { version = "0.13.5", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
stacker = "0.1.25"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
winnow = { version = "1.0.4", default-features = false, features = ["std", "parser"] }

[features]
default = ["reqwest", "reqwest-rustls", "reqwest-http2", "reqwest-system-proxy"]
chrono = ["dep:chrono"]
geo-types = ["dep:geo-types"]
geojson = ["dep:geojson"]
http = ["dep:bytes", "dep:headers", "dep:http", "dep:percent-encoding"]
linked-data = ["dep:jsonld"]
reqwest = ["http", "dep:reqwest"]
reqwest-http2 = ["reqwest", "reqwest/http2"]
reqwest-native-tls = ["reqwest", "reqwest/native-tls"]
reqwest-rustls = ["reqwest", "reqwest/rustls"]
reqwest-system-proxy = ["reqwest", "reqwest/system-proxy"]

[dev-dependencies]
anyhow = "1.0.104"
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
trybuild = "1.0.122"
wiremock = "0.6.5"

[lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_qualifications = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
absolute_paths = "deny"
allow_attributes_without_reason = "deny"
arc_with_non_send_sync = "deny"
await_holding_lock = "deny"
branches_sharing_code = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cloned_instead_of_copied = "warn"
expect_used = "deny"
future_not_send = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"
unnecessary_self_imports = "warn"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"

