# Permissive-only allow list. A licence is added when a dependency first brings it in; an allowance no dependency
# uses is a warning.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
# Apache-2.0 WITH LLVM-exception is Apache-2.0 with obligations removed; it reaches the build only as a build
# dependency (ar_archive_writer, via jsonld -> jstrict -> stacker -> psm). ISC and BSD-3-Clause come with the rustls
# stack.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]

# CDLA-Permissive-2.0 covers data, not code: this crate is the Mozilla root certificate bundle, reached through
# reqwest -> rustls-platform-verifier. Permissive, with no obligation on the crate's own source.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# proc-macro-error is a build-time proc-macro reached only through langtag 1.1.0 -> str-newtype 2.0.0 -> str-newtype-derive;
# no released langtag avoids it. Unmaintained, not vulnerable.
ignore = [{ id = "RUSTSEC-2024-0370", reason = "build-time only, via langtag -> str-newtype; no maintained langtag release avoids it" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
