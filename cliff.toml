[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.\n
"""
# Each group name starts with an html comment holding its sort key: `group_by` sorts groups by name, and `striptags`
# removes the key from the rendered heading. Commit messages render as written, lowercase.
body = """
{% if version %}\
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.scope %}`{{ commit.scope }}` - {% endif %}{{ commit.message }}{% if commit.breaking %} ⚠️ **BREAKING**{% endif %}
{% endfor %}
{% endfor %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ".*-rc.*"
sort_commits = "newest"
commit_parsers = [
    { message = "^feat", group = "<!-- 00 -->🚀 Features" },
    { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 02 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 03 -->🔧 Refactor" },
    { message = "^docs?", group = "<!-- 04 -->📚 Documentation" },
    { message = "^test", group = "<!-- 05 -->🧪 Tests" },
    { message = "^style", group = "<!-- 06 -->🎨 Style" },
    { message = "^build", group = "<!-- 07 -->🏗️ Build" },
    { message = "^ci", group = "<!-- 08 -->👷 CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "<!-- 09 -->🧹 Chores" },
    { message = ".*", group = "<!-- 10 -->💡 Other" },
]
