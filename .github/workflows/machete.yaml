name: machete

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: machete-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bnjbvr/cargo-machete@main
        with:
          args: --with-metadata
