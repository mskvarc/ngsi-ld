name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+

permissions:
  contents: read

jobs:
  verify:
    name: verify the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Tag matches the manifest version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "ngsi-ld") | .version')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml" >&2
            exit 1
          fi

      - name: Tag is on master
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "tag ${GITHUB_REF_NAME} points at a commit that is not on master" >&2
            exit 1
          fi

      # Pre-releases are left out of the changelog (cliff.toml folds alpha, beta and rc tags into the stable release that
      # follows them), so only a stable tag regenerates it. The version matches the one CHANGELOG.md is generated with
      # locally, so both render the same text; the template's commit_groups filter needs git-cliff 2.14.
      - name: Regenerate the changelog
        if: ${{ !contains(github.ref_name, '-') }}
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: git-cliff/CHANGELOG.md

      # Generated before the tag existed, the committed file dates the tag's section by the day it was generated; here
      # it is dated by the tagged commit. Only that one date may differ.
      - name: Changelog is up to date
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          heading="^(## \[${version//./\\.}\]\([^)]*\)) - [0-9]{4}-[0-9]{2}-[0-9]{2}$"
          if ! diff -u <(sed -E "s/${heading}/\1/" CHANGELOG.md) <(sed -E "s/${heading}/\1/" git-cliff/CHANGELOG.md); then
            echo "CHANGELOG.md is not what git cliff generates for ${GITHUB_REF_NAME}; run git cliff --tag ${GITHUB_REF_NAME} --with-tag-message with the tag message, -o CHANGELOG.md, and commit it before tagging" >&2
            exit 1
          fi

      - run: cargo test --workspace --all-features --locked

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every release, a pre-release too, lists the changes since the previous stable release. git-cliff's --current
      # stops at the newest tag of any kind, so the range names the stable tag. Via env: never parsed as shell.
      - name: Resolve the release notes range
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          range=""
          if previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "${TAG}^" 2>/dev/null)"; then
            range="${previous}..${TAG}"
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"

      # The notes open with the annotated tag's message. The template's commit_groups filter needs git-cliff 2.14.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ steps.notes.outputs.range }} --strip all -o RELEASE_NOTES.md

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}
          name: ${{ github.ref_name }}
          bodyFile: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
