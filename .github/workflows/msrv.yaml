name: msrv

# On a pull request this runs only when the manifest or the lock file changes, as a dependency update is what usually
# raises the msrv. Clippy's `incompatible_msrv` lint catches a newer standard library API in the code itself.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/msrv.yaml"

concurrency:
  group: msrv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msrv:
    name: cargo check on the msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must match `rust-version` in Cargo.toml.
      - name: Install the msrv toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo +1.96.0 check --no-default-features --locked
      - run: cargo +1.96.0 check --all-features --locked
