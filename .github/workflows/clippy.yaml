name: clippy

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Default features are empty, so a warning that only a build without some feature shows reaches every caller.
  clippy-features:
    name: cargo clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no features
            features: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo clippy --workspace --all-targets --no-default-features --features "${{ matrix.features }}" --locked -- -D warnings
