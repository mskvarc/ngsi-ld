name: clippy

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".github/workflows/clippy.yaml"

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # A caller can build with any subset of the features, so a warning that only a build without some feature shows
  # reaches some caller. Ten builds are too many for every pull request, so the matrix runs after a merge.
  clippy-features:
    name: cargo clippy (${{ matrix.name }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no features
            features: ""
          - name: chrono
            features: chrono
          - name: geo-types
            features: geo-types
          - name: geojson
            features: geojson
          - name: http
            features: http
          - name: linked-data
            features: linked-data
          - name: reqwest
            features: reqwest
          - name: reqwest-rustls
            features: reqwest-rustls
          - name: reqwest-native-tls
            features: reqwest-native-tls
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --no-default-features --features "${{ matrix.features }}" --locked -- -D warnings
