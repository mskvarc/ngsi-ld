name: Feature request
description: Suggest new functionality or an improvement to the API.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first, in case this is already proposed. A new public item, a new dependency or a breaking change is agreed here before any code is written.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What you are trying to do, and what is missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you would like the calling code to read. A sketch is enough.
      render: rust
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility
      description: Would this change or remove something in the current public API?
      options:
        - No, it only adds
        - Yes, it changes or removes something
        - Not sure
    validations:
      required: true
  - type: input
    id: clause
    attributes:
      label: Specification clause
      description: The clause of ETSI GS CIM 009 v1.9.1 this models, if it models one.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including what you do today, and why they fall short.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
